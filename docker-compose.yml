services:

  postgres:
    image: postgres:16
    container_name: nexus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nexus -d nexus"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .

    container_name: nexus-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: